name: Build SEVANA Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract and Build Debug APK
        run: |
          mkdir -p build_src
          unzip -o SEVANA_Android_APK_Project.zip -d build_src
          echo "dependencies { implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22') }" >> build_src/app/build.gradle
          cd build_src
          gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEVANA-Android-APK
          path: build_src/app/build/outputs/apk/debug/app-debug.apk
